name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.0"
            otp: "27.0"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: strict

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - run: mix docs --warnings-as-errors
      - run: mix hex.build
      - name: Inspect package contents
        run: |
          test -f disposable-0.2.0.tar
          test "$(tar -xOf disposable-0.2.0.tar contents.tar.gz | tar -tzf - | awk 'END { print NR }')" -gt 0
          ! tar -xOf disposable-0.2.0.tar contents.tar.gz | tar -tzf - | awk '{ print $0 }' | grep -E '(^|/)(\.git|_build|deps|cover)(/|$)'
